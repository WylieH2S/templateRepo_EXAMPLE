# drift-sweep config — TEMPLATE (blueprint for new projects).
#
# This file ships with templateRepo_EXAMPLE so init-project.sh can seed
# new repos with a working drift-sweep baseline. Tune CODE_ROOTS and
# SOURCE_EXTENSIONS for your stack before first use.
#
# ── Per-stack starting points (uncomment + adapt one) ────────────────
#
# TypeScript / React / Vite:
#   CODE_ROOTS="src tests"
#   SOURCE_EXTENSIONS="ts tsx"
#
# TypeScript / Node / library:
#   CODE_ROOTS="src tests"
#   SOURCE_EXTENSIONS="ts"
#
# Python:
#   CODE_ROOTS="src tests"
#   SOURCE_EXTENSIONS="py"
#   # NOTE: orphan check is regex-based for TS/JS — won't match Python
#   # `def`/`class` until DO-002 (stack-aware enhancement) lands.
#
# Go:
#   CODE_ROOTS="."
#   SOURCE_EXTENSIONS="go"
#
# Rust:
#   CODE_ROOTS="src"
#   SOURCE_EXTENSIONS="rs"
#
# Swift / iOS:
#   CODE_ROOTS="<App Name>"   # quote dirs with spaces
#   SOURCE_EXTENSIONS="swift"
#   # NOTE: orphan check no-op for Swift until DO-002.
#
# Embedded C/C++ (GBDK, Arduino, MCU firmware):
#   CODE_ROOTS="src include"
#   SOURCE_EXTENSIONS="c h cpp hpp ino"
#   # NOTE: orphan check no-op for C/C++ until DO-002.
#
# Mixed/content repo (operations, docs, configs):
#   # Leave CODE_ROOTS unset — orphan check is irrelevant. Other checks
#   # (working tree, untracked docs, cruft dirs, journal headers,
#   # substrate freshness, CLAUDE.md table) still run.
#
# ── Common allowlist patterns ───────────────────────────────────────
#
# If your stack uses event-handler exports that look orphan from a
# pure-source perspective (e.g., Portal SDK `On[A-Z]*`, framework
# lifecycle methods), allowlist them:
#   ORPHAN_EXPORT_ALLOWLIST="^On[A-Z]"           # Portal SDK pattern
#   ORPHAN_EXPORT_ALLOWLIST="^(default|setup)$"  # framework hooks
#
# ── Exclusions ──────────────────────────────────────────────────────
#
# Exclude generated/vendored files that would skew the orphan reference
# count (e.g., a flat compiled bundle that "references" everything):
#   EXCLUDE_FILES="dist/.*|\.generated\.|bundle\.ts$"
#
# ── Thresholds (defaults shown; tune if false-positive rate is high) ─

DIFF_FAIL_THRESHOLD=1000
JOURNAL_DIFF_LINES_FAIL=3
JOURNAL_HEADER_SCAN=80
JOURNAL_HEADER_FAIL=5
MISSION_STALE_DAYS=14

# ── Canonical tracking (SESSION-089; fork retired 2026-08-16) ───────
#
# Skills under .claude/skills/ that are DELIBERATE FORKS of the workspace
# canonical, not copies expected to track it. A declared fork is never a
# drift failure and is never auto-synced — `--maintenance` surfaces it as a
# WY decision (hand merge), because a blind copy would destroy its own work.
#
# THE LIST IS NOW EMPTY, and that is the point of the change.
#
# validate-substrate was forked here because it had to be genericized
# ({{AI}} / {{HUMAN}} / {{TOKEN}}, zero literal chloeai) to carry a filename
# resolver, so THIS repo could self-validate 0-fails both before and after init
# substitution — and, in the words of the note this replaces, "the canonical
# cannot do that."
#
# The canonical can do that now. drift-sweep and validate-substrate both RESOLVE
# the carrier extension from the repo's own root waystone card instead of
# hardcoding `chloeai`/`heywy`, so the placeholder-named template and a seeded
# repo are the SAME code path. Verified by running the canonical here: its output
# is byte-identical to the fork's it replaced.
#
# Both skills and both hooks are PLAIN, byte-identical copies of the workspace
# canonical — real files, no substitution. Not symlinks: this repo is meant to be
# cloned away from this machine ("Use this template" is the first line of the
# README), and a relative symlink into ~/GitHub dangles the moment it leaves.
# v0.1.29 briefly made them symlinks and that was wrong; v0.1.30 settled it.
#
# What made the OLD copies dangerous was the SUBSTITUTION, not the copying — it
# had silently corrupted the doorway check and template_form's own guard. Plain
# copies carry no such risk, and drift-sweep gates them: DIVERGED here means
# re-copy from the canonical. init-project.sh must never token-substitute these
# two directories; see the exclusion note in that script.
CANONICAL_FORK_SKILLS=""
