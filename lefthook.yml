# lefthook.yml — pre-commit and pre-push guards.
#
# Install lefthook once on your machine:   brew install lefthook
# Activate for this repo:                  lefthook install
#
# This config is intentionally minimal and language-agnostic.
# Stack-specific hooks (lint, format, test) should be added by
# the project after init-project.sh.

pre-commit:
  parallel: true
  commands:
    # Block .DS_Store from being committed
    no-ds-store:
      run: |
        if git diff --cached --name-only | grep -E '(^|/)\.DS_Store$' > /dev/null; then
          echo "✗ .DS_Store files in staged changes — unstage them or add to .gitignore"
          git diff --cached --name-only | grep -E '(^|/)\.DS_Store$'
          exit 1
        fi

    # Block large files (>10 MB) from being committed
    no-large-files:
      run: |
        threshold=10485760
        bad=$(git diff --cached --name-only | while read f; do
          [ -f "$f" ] || continue
          size=$(wc -c < "$f")
          if [ "$size" -gt "$threshold" ]; then
            echo "$f ($(($size / 1024 / 1024)) MB)"
          fi
        done)
        if [ -n "$bad" ]; then
          echo "✗ Files larger than 10 MB staged. Use git-lfs or add to .gitignore:"
          echo "$bad"
          exit 1
        fi

    # Block likely-secret files
    no-secrets:
      run: |
        pat='\.env$|\.env\.local|\.env\.production|\.pem$|\.key$|secrets/|credentials/'
        bad=$(git diff --cached --name-only | grep -E "$pat" || true)
        if [ -n "$bad" ]; then
          echo "✗ Potential secret files staged:"
          echo "$bad"
          echo "If these are safe to commit (e.g. .env.example), rename them. Otherwise unstage and add to .gitignore."
          exit 1
        fi

    # Drift sweep — catches probe journals in file headers, untracked audit docs,
    # and uncommitted churn before it accumulates into hard-to-review bulk.
    # Gated subset: working-tree, untracked-docs, file-journals, waystone-validity,
    # waystone-freshness, wrap-continuity.
    # waystone-validity asks whether a card PARSES; waystone-freshness (armed
    # 2026-08-07) asks whether it was re-stamped when the files it owns changed.
    # Both graceful-pass where no _waystone.chloeai exists, so a stamped repo with
    # no WISL cards yet inherits them inert rather than broken.
    # wrap-continuity is the Agent Boot Contract W1 write-edge arm (ADR-BOOT-001) —
    # git-native, so it fires for ANY committing agent (Claude, Codex, …).
    # Orphans and mission-freshness are advisory only — run full sweep manually to review.
    drift-sweep:
      run: bash .claude/skills/drift-sweep/sweep.sh --quiet --fail-on=working-tree,untracked-docs,file-journals,waystone-validity,waystone-freshness,wrap-continuity

    # Warn on direct main commits (override with --no-verify if intentional)
    not-on-main:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
          echo "⚠  Committing directly to $branch. Use --no-verify to override."
          # Note: not exiting 1 — this is a warning. Change to `exit 1` to make it a hard block.
        fi

pre-push:
  parallel: true
  # SCRIPT FORM, ON PURPOSE (D-75, 2026-10-20). READ BEFORE CHANGING IT BACK.
  # lefthook skips a `run:` pre-push job — `(skip) no matching push files` — when
  # HEAD has no diff against its OWN @{push}, whatever refs the push moves. Two
  # pushes hit that by construction, and both arms below used to be absent on them:
  #   - a fast-forward of already-pushed commits: `git push origin work:main` with
  #     work level with origin/work (planTheBeast, 2026-10-20)
  #   - a force-push from a clone whose origin/<branch> is STALE because another
  #     host pushed: the D-18 rewind, the destructive one
  # `script:` jobs are NOT skipped on either. Measured 2026-10-20 on lefthook 2.1.11
  # (CHLOE-WyliNux) and 2.1.8 (ChloeMac). That is observed behaviour, not documented
  # behaviour, so after ANY lefthook upgrade, on every host, run:
  #   bash ~/GitHub/.claude/skills/drift-sweep/lefthook-skip-fixture.sh
  # Exit 1 = these arms are inert on those pushes again; until fixed, run
  # `lefthook run pre-push --force` by hand before such a push.
  # The two scripts in .lefthook/pre-push/ are identical in every fleet repo. What
  # differs per repo is `args`, so this repo's --fail-on list stays in this file,
  # where validate-substrate and the fail-on audit read it.
  jobs:
    # The blocking half of the backstop (SESSION-085). `--no-verify` on `git commit`
    # does NOT skip pre-push, so a locally-bypassed commit is still caught before it
    # reaches origin — the exact DEC-103 pattern. Closes SL-001 residual #1, open
    # since June: "the arm is pre-commit only, with no push-time backstop".
    # Honest limit: `git push --no-verify` skips this. What catches that is the
    # nightly `fleet-sweep.yml` in repoManager (since 2026-08-06): it DETECTS, up to
    # 24h later, it does not block, and only while it is green — it was red on every
    # run 2026-09-15..10-20 (D-71). From 2026-08-28 this comment said the backstop
    # "runs nowhere": that check looked in three places and the job was in a fourth
    # (D-17). Do not read a green push as evidence the substrate is clean.
    - name: drift-sweep-push
      script: drift-sweep-push.sh
      runner: bash
      args: --quiet --fail-on=working-tree,untracked-docs,file-journals,waystone-validity,waystone-freshness,wrap-continuity
    # Block a push that would DISCARD commits the remote already has.
    #
    # REPLACES `no-force-push-main`, which blocked nothing: its body was an echo,
    # and it read the pushed ref from "$1", which lefthook never passed to it.
    #
    # THE PROXY: this asks the remote (a fetch) instead of trusting the local
    # remote-tracking cache, which goes stale exactly when a second host pushes —
    # the case that matters. HOW IT PASSES FALSELY: `git push --no-verify` skips
    # it; a fetch failure is treated as "cannot tell" and allowed through rather
    # than blocking work on a flaky network; and a lefthook release that starts
    # skipping script jobs as well would silence it (the fixture above catches that).
    #
    # ── MEASURED: D-18 pilot 2026-09-02 (run form), D-75 2026-10-20 (script form) ──
    #                                           run form            script form
    #   local ahead 1 + remote ahead 1, --force  FIRES, BLOCKED      FIRES, BLOCKED
    #   ALLOW_FORCE_PUSH=1 on that same state    allowed through     allowed through
    #   stale origin/<branch>, --force (rewind)  SKIPPED, CLOBBERED  FIRES, BLOCKED
    # repoManager is NOT affected either way: its pre-push is plain git via
    # core.hooksPath, not lefthook.
    - name: no-clobber-remote
      script: no-clobber-remote.sh
      runner: sh
