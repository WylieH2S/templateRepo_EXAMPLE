# lefthook.yml — pre-commit and pre-push guards.
#
# Install lefthook once on your machine:   brew install lefthook
# Activate for this repo:                  lefthook install
#
# This config is intentionally minimal and language-agnostic.
# Stack-specific hooks (lint, format, test) should be added by
# the project after init-project.sh.

pre-commit:
  parallel: true
  commands:
    # Block .DS_Store from being committed
    no-ds-store:
      run: |
        if git diff --cached --name-only | grep -E '(^|/)\.DS_Store$' > /dev/null; then
          echo "✗ .DS_Store files in staged changes — unstage them or add to .gitignore"
          git diff --cached --name-only | grep -E '(^|/)\.DS_Store$'
          exit 1
        fi

    # Block large files (>10 MB) from being committed
    no-large-files:
      run: |
        threshold=10485760
        bad=$(git diff --cached --name-only | while read f; do
          [ -f "$f" ] || continue
          size=$(wc -c < "$f")
          if [ "$size" -gt "$threshold" ]; then
            echo "$f ($(($size / 1024 / 1024)) MB)"
          fi
        done)
        if [ -n "$bad" ]; then
          echo "✗ Files larger than 10 MB staged. Use git-lfs or add to .gitignore:"
          echo "$bad"
          exit 1
        fi

    # Block likely-secret files
    no-secrets:
      run: |
        pat='\.env$|\.env\.local|\.env\.production|\.pem$|\.key$|secrets/|credentials/'
        bad=$(git diff --cached --name-only | grep -E "$pat" || true)
        if [ -n "$bad" ]; then
          echo "✗ Potential secret files staged:"
          echo "$bad"
          echo "If these are safe to commit (e.g. .env.example), rename them. Otherwise unstage and add to .gitignore."
          exit 1
        fi

    # Drift sweep — catches probe journals in file headers, untracked audit docs,
    # and uncommitted churn before it accumulates into hard-to-review bulk.
    # Gated subset: working-tree, untracked-docs, file-journals, waystone-validity,
    # waystone-freshness, wrap-continuity.
    # waystone-validity asks whether a card PARSES; waystone-freshness (armed
    # 2026-08-07) asks whether it was re-stamped when the files it owns changed.
    # Both graceful-pass where no _waystone.chloeai exists, so a stamped repo with
    # no WISL cards yet inherits them inert rather than broken.
    # wrap-continuity is the Agent Boot Contract W1 write-edge arm (ADR-BOOT-001) —
    # git-native, so it fires for ANY committing agent (Claude, Codex, …).
    # Orphans and mission-freshness are advisory only — run full sweep manually to review.
    drift-sweep:
      run: bash .claude/skills/drift-sweep/sweep.sh --quiet --fail-on=working-tree,untracked-docs,file-journals,waystone-validity,waystone-freshness,wrap-continuity

    # Warn on direct main commits (override with --no-verify if intentional)
    not-on-main:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
          echo "⚠  Committing directly to $branch. Use --no-verify to override."
          # Note: not exiting 1 — this is a warning. Change to `exit 1` to make it a hard block.
        fi

pre-push:
  parallel: true
  commands:
    # The blocking half of the backstop (SESSION-085). `--no-verify` on `git commit`
    # does NOT skip pre-push, so a locally-bypassed commit is still caught before it
    # reaches origin — the exact DEC-103 pattern. Closes SL-001 residual #1, open
    # since June: "the arm is pre-commit only, with no push-time backstop".
    # Honest limit: `git push --no-verify` still skips this, AND NOTHING CATCHES IT.
    # This comment used to name "the nightly fleet-sweep in repoManager" as the
    # backstop for a determined bypass. Checked 2026-08-28: no systemd timer, no
    # cron entry and no unit file for such a sweep exists on the Linux host, and on
    # the Mac the scan LaunchAgent is deliberately unloaded. The backstop runs
    # nowhere. Do not read a green push as evidence the substrate is clean; if a
    # real backstop is wanted, it has to be built (docket D-17).
    drift-sweep-push:
      run: bash .claude/skills/drift-sweep/sweep.sh --quiet --fail-on=working-tree,untracked-docs,file-journals,waystone-validity,waystone-freshness,wrap-continuity
    # Block a push that would DISCARD commits the remote already has.
    #
    # REPLACES `no-force-push-main`, which was named for a guarantee it did not
    # provide: its body was `echo "ℹ Pushing to $branch"` and it blocked nothing.
    # It could not have worked in any form — it read the pre-push ref from "$1",
    # and lefthook forwards NEITHER args NOR stdin to commands (verified against
    # lefthook 2026-08-28 with a probe command: both empty). So it never even saw
    # the refs it claimed to judge. Anyone reading this file believed force-pushes
    # to main were prevented for as long as it sat here.
    #
    # THE PROXY: this asks the remote (a fetch) instead of trusting the local
    # remote-tracking cache, which goes stale exactly when a second host pushes —
    # the case that matters. HOW IT PASSES FALSELY: `git push --no-verify` skips
    # every hook here, and a fetch failure is treated as "cannot tell" and allowed
    # through rather than blocking work on a flaky network.
    #
    # ── MEASURED 2026-09-02 (docket D-18 pilot). READ BEFORE RELYING ON THIS. ──
    # IT DOES NOT FIRE ON A PURE REWIND, WHICH IS THE MOST DESTRUCTIVE CASE.
    # lefthook SKIPS every pre-push command when the push introduces no new
    # commits — it prints `(skip) no matching push files` — and a force-push whose
    # local branch is strictly BEHIND the remote introduces none by definition.
    # Measured on a two-clone fixture with lefthook 2.1.11:
    #   local ahead 1 + remote ahead 1, --force  -> guard FIRES, push BLOCKED  ✓
    #   ALLOW_FORCE_PUSH=1 on that same state    -> allowed through            ✓
    #   push that adds a commit                  -> guard runs                 ✓
    #   local strictly BEHIND, --force           -> SKIPPED, remote CLOBBERED  ✗
    # The escape hatch is a CLI flag on the runner, `lefthook run pre-push
    # --force` ("do not skip if no files changed"), which DOES make it fire. There
    # is no config key for it: `force: true` and `skip_empty: false` were both
    # tried at hook and command level and neither changed the skip. The generated
    # `.git/hooks/pre-push` shim calls `call_lefthook run "pre-push" "$@"` with no
    # such flag, and that shim is untracked and regenerated by `lefthook install`,
    # so editing it there is a fix that can vanish without notice.
    # NOTE `drift-sweep-push` ABOVE HAS THE SAME HOLE, for the same reason.
    # repoManager is NOT affected: its pre-push is plain-git via core.hooksPath,
    # not lefthook. The 11 project repos all are.
    # This comment states the limit rather than removing the guard, because the
    # guard is still strictly better than the `no-force-push-main` it replaced —
    # that one could never fire at all. But do not read a green push as proof the
    # remote was safe from a rewind.
    no-clobber-remote:
      run: |
        br=$(git rev-parse --abbrev-ref HEAD)
        up=$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null) || exit 0
        git fetch --quiet origin "$br" 2>/dev/null || true
        behind=$(git rev-list --count "HEAD..$up" 2>/dev/null || echo 0)
        if [ "${behind:-0}" -gt 0 ]; then
          echo "✗ $up has $behind commit(s) this clone does not have."
          echo "  A force-push here DISCARDS them. Integrate first: git pull --rebase"
          if [ "${ALLOW_FORCE_PUSH:-0}" = "1" ]; then
            echo "  → ALLOW_FORCE_PUSH=1 set; proceeding on explicit intent."
          else
            echo "  Override deliberately with: ALLOW_FORCE_PUSH=1 git push --force ..."
            exit 1
          fi
        fi
